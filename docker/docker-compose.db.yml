services:
  db:
    image: postgres:16-alpine
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budgety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budgety}
      POSTGRES_DB: ${POSTGRES_DB:-budgety}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budgety}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:

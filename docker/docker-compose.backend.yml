services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://budgety:budgety@localhost:5432/budgety}
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

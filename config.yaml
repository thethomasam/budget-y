app:
  title: "Budgety API"
  description: "Personal budget tracking and analytics API"
  version: "1.0.0"
  root_path: "/api"
  port: 8000

redis:
  url: "redis://redis:6379/0"

database:
  path: "./budgety.db"

user:
  name: "Sam Thomas"

categoriser:
  similarity_threshold: 0.8

frontend:
  transaction_limit: 1000
  monthly_budget: 3000

budget_goals:
  - name: "Groceries"
    icon: "🛒"
    budget: 150
    aliases: ["Groceries", "Supermarket"]
  - name: "Dining & Food"
    icon: "🍽️"
    budget: 200
    aliases: ["Dining & Food", "Food & Dining", "Restaurants"]
  - name: "Petrol & Fuel"
    icon: "⛽"
    budget: 70
    aliases: ["Petrol", "Fuel", "Auto & Fuel"]
  - name: "Transport & Travel"
    icon: "🚗"
    budget: 80
    aliases: ["Transport & Travel", "Transportation", "Rideshare", "Public Transport", "Parking"]
  - name: "Shopping"
    icon: "🛍️"
    budget: 200
    aliases: ["Shopping & Retail"]
  - name: "Bills & Utilities"
    icon: "💡"
    budget: 300
    aliases: ["Utilities & Bills", "Banking & Transfers"]
  - name: "Entertainment"
    icon: "🎬"
    budget: 100
    aliases: ["Entertainment & Subscriptions", "Movies"]
  - name: "Health & Wellness"
    icon: "🏥"
    budget: 200
    aliases: ["Insurance & Healthcare", "Medical & Pharmacy", "Health & Fitness"]
  - name: "Travel"
    icon: "✈️"
    budget: 300
    aliases: ["Travel & Accommodation"]
  - name: "Other"
    icon: "📦"
    budget: 200
    aliases: ["Education & Learning", "Home & Hardware"]

processing:
  chunk_size: 100
  llm_batch_size: 10
  upload_dir: "/tmp/budgety_uploads"
  job_ttl: 3600

llm:
  model: "qwen3:8b"
  url: "http://ollama:11434/api/generate"
  timeout: 600.0
  think: false

search:
  max_results: 3
  timeout: 10.0

app:
  title: "Budgety API"
  description: "Personal budget tracking and analytics API"
  version: "1.0.0"
  root_path: "/api"
  port: 8000

redis:
  url: "redis://redis:6379/0"

database:
  path: "./budgety.db"

user:
  name: "Sam Thomas"

categoriser:
  similarity_threshold: 0.8

frontend:
  transaction_limit: 1000
  monthly_budget: 3000

budget_goals:
  - name: "Groceries"
    icon: "🛒"
    budget: 220   # avg $197, max $302 — nudged up slightly for comfort
    aliases: ["Groceries", "Supermarket"]
  - name: "Dining & Food"
    icon: "🍽️"
    budget: 300   # avg $209 but trending up to $400 — set as a stretch target
    aliases: ["Dining & Food", "Food & Dining", "Restaurants"]
  - name: "Petrol & Fuel"
    icon: "⛽"
    budget: 70    # avg $36, max $87 — covers worst month
    aliases: ["Petrol", "Fuel", "Auto & Fuel"]
  - name: "Transport & Travel"
    icon: "🚗"
    budget: 80    # avg $130 driven by one big Dec trip — normal months ~$50
    aliases: ["Transport & Travel", "Transportation", "Rideshare", "Public Transport", "Parking"]
  - name: "Shopping"
    icon: "🛍️"
    budget: 250   # avg $232 ex-LIFE REWARDS anomaly
    aliases: ["Shopping & Retail"]
  - name: "Bills & Utilities"
    icon: "💡"
    budget: 120   # avg $75, high months hit $205 — set buffer
    aliases: ["Utilities & Bills", "Banking & Transfers"]
  - name: "Entertainment"
    icon: "🎬"
    budget: 60    # avg $55
    aliases: ["Entertainment & Subscriptions", "Movies"]
  - name: "Health & Wellness"
    icon: "🏥"
    budget: 160   # avg $174 on active months (BUPA + occasional GP)
    aliases: ["Insurance & Healthcare", "Medical & Pharmacy", "Health & Fitness"]
  - name: "Travel"
    icon: "✈️"
    budget: 150   # sporadic — set as a monthly set-aside
    aliases: ["Travel & Accommodation"]
  - name: "Other"
    icon: "📦"
    budget: 150   # avg $275 but last 2 months $0 — watch this category
    aliases: ["Education & Learning", "Home & Hardware"]

processing:
  chunk_size: 100
  llm_batch_size: 10
  upload_dir: "/tmp/budgety_uploads"
  job_ttl: 3600

llm:
  model: "qwen3:8b"
  url: "http://ollama:11434/api/generate"
  timeout: 600.0
  think: false

search:
  max_results: 3
  timeout: 10.0
